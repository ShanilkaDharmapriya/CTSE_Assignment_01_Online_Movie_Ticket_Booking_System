name: Movie Service CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build-test:
    name: Backend Build, Test and Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./movie-service
        run: mvn clean package -DskipTests

      - name: Run Tests
        working-directory: ./movie-service
        run: mvn test

      # DevSecOps: Snyk vulnerability scanning (Placeholder step logic)
      - name: Snyk Security Scan
        continue-on-error: true # So pipeline doesn't break if no token provided
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: ./movie-service/pom.xml

  frontend-build:
    name: Frontend Build and Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './movie-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./movie-frontend
        run: npm ci

      - name: Build
        working-directory: ./movie-frontend
        run: npm run build

      - name: Snyk Security Scan for Frontend
        continue-on-error: true # So pipeline doesn't break if no token provided
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: ./movie-frontend/package.json

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./movie-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/movie-service-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./movie-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/movie-react-frontend:latest

  deploy:
    name: Deploy to Cloud (AWS/Azure)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy Placeholder
        run: |
          echo "Add your AWS ECS/Elastic Beanstalk or Azure Container Apps deployment script here."
          echo "Images are ready: ${{ secrets.DOCKER_USERNAME }}/movie-service-backend:latest, ${{ secrets.DOCKER_USERNAME }}/movie-react-frontend:latest"
